<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام متابعة الطلاب - الأستاذ عبدالعزيز الفيفي</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen">

    <!-- شاشة العنوان -->
    <header class="bg-indigo-600 text-white p-4 shadow-md text-center">
        <h1 class="text-2xl font-bold">نظام المتابعة اليومية للطلاب</h1>
        <p class="text-sm opacity-90">المعلم: عبدالعزيز الفيفي | مادة الكفايات اللغوية</p>
    </header>

    <main class="container mx-auto p-4 max-w-4xl">
        <!-- شريط التنقل بين الفصول -->
        <div class="flex justify-center gap-2 mb-6 overflow-x-auto py-2">
            <button onclick="switchClass('الفصل الأول')" class="class-btn px-4 py-2 bg-indigo-600 text-white rounded-xl font-bold shadow transition">أول ثانوي/1</button>
            <button onclick="switchClass('الفصل الثاني')" class="class-btn px-4 py-2 bg-white text-indigo-600 border border-indigo-300 rounded-xl font-bold shadow transition">أول ثانوي/2</button>
            <button onclick="switchClass('الفصل الثالث')" class="class-btn px-4 py-2 bg-white text-indigo-600 border border-indigo-300 rounded-xl font-bold shadow transition">أول ثانوي/3</button>
            <button onclick="switchClass('الفصل الرابع')" class="class-btn px-4 py-2 bg-white text-indigo-600 border border-indigo-300 rounded-xl font-bold shadow transition">أول ثانوي/4</button>
        </div>

        <!-- قسم إضافة طالب جديد -->
        <div class="bg-white p-4 rounded-2xl shadow mb-6 flex flex-wrap gap-3 items-center justify-between">
            <h2 class="font-bold text-lg text-indigo-700" id="current-class-title">إدارة طلاب: الفصل الأول</h2>
            <div class="flex gap-2 w-full md:w-auto">
                <input type="text" id="new-student-name" placeholder="اسم الطالب الرباعي..." class="border p-2 rounded-xl flex-1 md:w-64 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <button onclick="addStudent()" class="bg-green-600 text-white px-4 py-2 rounded-xl font-bold hover:bg-green-700 transition">إضافة طالب</button>
            </div>
        </div>

        <!-- قائمة الطلاب -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="students-container">
            <!-- يتم تعبئة الطلاب هنا برمجياً -->
        </div>
    </main>

    <!-- نافذة ملف الطالب المفصل (Modal) -->
    <div id="student-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl max-w-lg w-full max-h-[90vh] overflow-y-auto p-6 relative shadow-2xl">
            <button onclick="closeModal()" class="absolute top-4 left-4 bg-gray-200 text-gray-700 w-8 h-8 rounded-full font-bold flex items-center justify-center hover:bg-gray-300">✕</button>
            
            <div id="modal-content">
                <!-- تفاصيل ملف الطالب الملّون -->
            </div>
        </div>
    </div>

    <!-- نافذة رصد السلوكيات (تفاعلية مشابهة للصورة الثانية) -->
    <div id="action-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 relative shadow-2xl">
            <h3 class="text-lg font-bold text-center mb-4 text-indigo-700" id="action-student-title">تسجيل تفاعل للطالب</h3>
            <div class="grid grid-cols-2 gap-2 mb-4">
                <button onclick="recordAction('حاضر', 'bg-green-100 text-green-700')" class="p-3 rounded-xl bg-green-500 text-white font-bold text-sm">حاضر</button>
                <button onclick="recordAction('غائب', 'bg-red-100 text-red-700')" class="p-3 rounded-xl bg-red-500 text-white font-bold text-sm">غائب</button>
                <button onclick="recordAction('مشاركة', 'bg-blue-100 text-blue-700')" class="p-3 rounded-xl bg-cyan-500 text-white font-bold text-sm">مشاركة (+)</button>
                <button onclick="recordAction('حل الواجب', 'bg-emerald-100 text-emerald-700')" class="p-3 rounded-xl bg-emerald-600 text-white font-bold text-sm">حل الواجب</button>
                <button onclick="recordAction('لم يحل الواجب', 'bg-rose-100 text-rose-700')" class="p-3 rounded-xl bg-rose-600 text-white font-bold text-sm">لم يحل الواجب (-)</button>
                <button onclick="recordAction('النوم في الحصة', 'bg-purple-100 text-purple-700')" class="p-3 rounded-xl bg-purple-600 text-white font-bold text-sm">نوم في الحصة</button>
                <button onclick="recordAction('إنجاز ملف', 'bg-teal-100 text-teal-700')" class="p-3 rounded-xl bg-teal-500 text-white font-bold text-sm">إنجاز ملف</button>
                <button onclick="recordAction('مشاغب / غير مهتم', 'bg-amber-100 text-amber-700')" class="p-3 rounded-xl bg-amber-500 text-white font-bold text-sm">مشاغب / غير مهتم</button>
            </div>
            <button onclick="closeActionModal()" class="w-full bg-gray-300 text-gray-700 p-2 rounded-xl font-bold">إلغاء</button>
        </div>
    </div>

    <script>
        // بيانات التطبيق الافتراضية مخزنة محلياً
        let activeClass = 'الفصل الأول';
        let currentStudentId = null;

        let dbData = JSON.parse(localStorage.getItem('teacher_tracker_data')) || {
            'الفصل الأول': [
                { id: 1, name: 'أسامة بن محمد بن وجدان', phone: '966566688614', actions: ['حل الواجب', 'إنجاز ملف', 'مشاركة'], attendance: 'حاضر' }
            ],
            'الفصل الثاني': [],
            'الفصل الثالث': [],
            'الفصل الرابع': []
        };

        function saveData() {
            localStorage.setItem('teacher_tracker_data', JSON.stringify(dbData));
            renderStudents();
        }

        function switchClass(className) {
            activeClass = className;
            document.querySelectorAll('.class-btn').forEach(btn => {
                if(btn.innerText.includes(className.replace('الفصل ', 'أول ثانوي/'))) {
                    btn.className = "class-btn px-4 py-2 bg-indigo-600 text-white rounded-xl font-bold shadow transition";
                } else {
                    btn.className = "class-btn px-4 py-2 bg-white text-indigo-600 border border-indigo-300 rounded-xl font-bold shadow transition";
                }
            });
            document.getElementById('current-class-title').innerText = `إدارة طلاب: ${className}`;
            renderStudents();
        }

        function addStudent() {
            const nameInput = document.getElementById('new-student-name');
            const name = nameInput.value.trim();
            if(!name) return alert('الرجاء إدخال اسم الطالب');
            
            dbData[activeClass].push({
                id: Date.now(),
                name: name,
                phone: '966500000000',
                actions: ['بداية متابعة'],
                attendance: 'حاضر'
            });
            nameInput.value = '';
            saveData();
        }

        function deleteStudent(id) {
            if(confirm('هل أنت متأكد من حذف هذا الطالب؟')) {
                dbData[activeClass] = dbData[activeClass].filter(s => s.id !== id);
                saveData();
            }
        }

        function renderStudents() {
            const container = document.getElementById('students-container');
            container.innerHTML = '';
            const students = dbData[activeClass] || [];

            if(students.length === 0) {
                container.innerHTML = `<p class="text-gray-500 col-span-2 text-center py-8">لا توجد طلاب مضافين في هذا الفصل حالياً.</p>`;
                return;
            }

            students.forEach(student => {
                container.innerHTML += `
                    <div class="bg-white p-4 rounded-2xl shadow flex items-center justify-between border border-gray-100">
                        <div>
                            <h3 class="font-bold text-lg text-gray-800">${student.name}</h3>
                            <p class="text-xs text-gray-500">${activeClass}</p>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="openActionModal(${student.id})" class="bg-indigo-50 text-indigo-600 px-3 py-1.5 rounded-xl text-sm font-bold hover:bg-indigo-100 transition">📝 رصد</button>
                            <button onclick="openModal(${student.id})" class="bg-emerald-50 text-emerald-600 px-3 py-1.5 rounded-xl text-sm font-bold hover:bg-emerald-100 transition">📊 الملف</button>
                            <button onclick="deleteStudent(${student.id})" class="text-red-400 hover:text-red-600 p-1">🗑️</button>
                        </div>
                    </div>
                `;
            });
        }

        function openActionModal(id) {
            currentStudentId = id;
            document.getElementById('action-modal').classList.remove('hidden');
            document.getElementById('action-modal').classList.add('flex');
        }

        function closeActionModal() {
            document.getElementById('action-modal').classList.add('hidden');
            document.getElementById('action-modal').classList.remove('flex');
        }

        function recordAction(actionName, styleClass) {
            for (let cls in dbData) {
                let student = dbData[cls].find(s => s.id === currentStudentId);
                if(student) {
                    student.actions.unshift(actionName);
                    break;
                }
            }
            saveData();
            closeActionModal();
        }

        function openModal(id) {
            let student = null;
            for (let cls in dbData) {
                let found = dbData[cls].find(s => s.id === id);
                if(found) { student = found; break; }
            }
            if(!student) return;

            const modalContent = document.getElementById('modal-content');
            modalContent.innerHTML = `
                <div class="text-center mb-6">
                    <div class="w-20 h-20 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center text-3xl font-bold mx-auto mb-2 shadow-inner">👤</div>
                    <h2 class="text-xl font-bold text-gray-900">${student.name}</h2>
                    <p class="text-sm text-gray-500">${activeClass}</p>
                    <a href="https://wa.me/${student.phone}" target="_blank" class="inline-block mt-2 bg-green-50 text-green-600 px-4 py-1.5 rounded-full text-xs font-bold border border-green-200">💬 بطاقة وصول ولي الأمر</a>
                </div>

                <div class="bg-indigo-50/50 p-4 rounded-2xl mb-4 border border-indigo-100">
                    <h4 class="font-bold text-indigo-900 text-sm mb-1">📌 ملخص الأداء</h4>
                    <p class="text-xs text-gray-600 leading-relaxed">يظهر الطالب تفاعلاً ومستوى في المتابعة المستمرة، مع رصد السلوكيات والأنشطة اليومية داخل الحصة الدراسية.</p>
                </div>

                <div class="mb-4">
                    <h4 class="font-bold text-gray-800 text-sm mb-2">🕒 النشاطات الأخيرة والسلوكيات</h4>
                    <div class="space-y-2 max-h-40 overflow-y-auto pr-1">
                        ${student.actions.map(act => `<div class="bg-gray-50 p-2 rounded-xl text-xs flex justify-between items-center border"><span class="font-semibold text-gray-700">${act}</span><span class="text-gray-400 text-[10px]">محدث</span></div>`).join('')}
                    </div>
                </div>

                <button onclick="closeModal()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700 transition">إغلاق الملف</button>
            `;

            document.getElementById('student-modal').classList.remove('hidden');
            document.getElementById('student-modal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('student-modal').classList.add('hidden');
            document.getElementById('student-modal').classList.remove('flex');
        }

        // تهيئة العرض الأول
        renderStudents();
    </script>
</body>
</html>
