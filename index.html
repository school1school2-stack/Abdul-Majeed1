        function initSystem() {
            applyRandomTheme();
            customActions = defaultActions;
            fetchClassesAndStudents();

            renderSettingsActionsDropdown();
            initPullToRefresh();
        }

        function initPullToRefresh() {
            let touchstartY = 0;
            const mainContainer = document.getElementById('main-scroll-container');

            window.addEventListener('touchstart', e => {
                touchstartY = e.touches[0].clientY;
            }, { passive: true });

            window.addEventListener('touchend', e => {
                let touchendY = e.changedTouches[0].clientY;
                if (mainContainer && mainContainer.scrollTop === 0 && touchendY - touchstartY > 120) {
                    location.reload();
                }
            }, { passive: true });
        }

        async function fetchClassesAndStudents() {
            try {
                const classDoc = await db.collection("system_settings").doc("classes_config").get();
                if (classDoc.exists && classDoc.data().classList) {
                    classList = classDoc.data().classList;
                } else {
                    classList = ['الفصل الأول', 'الفصل الثاني', 'الفصل الثالث', 'الفصل الرابع'];
                    await db.collection("system_settings").doc("classes_config").set({ classList: classList });
                }
            } catch (e) {
                classList = ['الفصل الأول', 'الفصل الثاني', 'الفصل الثالث', 'الفصل الرابع'];
            }
            renderClassesListUI();
            renderView();
            fetchStudents();
        }

        async function saveClassesToCloud() {
            try {
                await db.collection("system_settings").doc("classes_config").set({ classList: classList });
            } catch (e) {
                console.error("خطأ في حفظ الفصول بالسحاب", e);
            }
        }

        function fetchStudents() {
            const approvedTbody = document.querySelector("#studentsTable tbody");
            const pendingTbody = document.querySelector("#pendingTable tbody");
            const pendingSection = document.getElementById("pendingSection");

            db.collection("allowed_students").orderBy("name").onSnapshot((snapshot) => {
                let approvedCount = snapshot.size;
                if(approvedTbody) approvedTbody.innerHTML = "";
                const approvedCountEl = document.getElementById("approvedCount");
                if(approvedCountEl) approvedCountEl.innerText = `الطلاب المعتمدين: ${approvedCount}`;

                allStudents = [];
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const email = doc.id;
                    const name = data.name || "";
                    
                    allStudents.push({
                        id: doc.id,
                        name: name,
                        email: email,
                        className: data.className || 'غير موزع',
                        phone: data.phone || '966566688614',
                        actions: data.actions || [],
                        attendanceStats: data.attendanceStats || { absents: 0, lates: 0, excuses: 0 }
                    });
                    
                    if(approvedTbody) {
                        const tr = document.createElement('tr');
                        tr.setAttribute('data-name', name);
                        tr.setAttribute('data-email', email);

                        let classOptionsHtml = `<option value="" disabled>📁 تعيين لفصل دراسي</option>`;
                        classList.forEach(cls => {
                            const prefix = (data.className === cls) ? '✔️ ' : '';
                            classOptionsHtml += `<option value="class_${cls}">${prefix}${cls}</option>`;
                        });
                        classOptionsHtml += `<option value="class_غير موزع">❌ إزالة من الفصل</option>`;

                        tr.innerHTML = `
                            <td style="text-align: right; font-weight: bold; font-size: 1.05rem; color: #1e293b;">
                                ${name}
                                <div style="font-size: 0.8rem; color: #800000; margin-top: 3px;">الفصل: ${data.className || 'غير موزع'}</div>
                            </td>
                            <td style="font-size: 0.95rem; color: #475569;">${email}</td>
                            <td>
                                <select class="action-select" onchange="handleAction(this, '${email}', '${name.replace(/'/g, "\\'")}', '${doc.id}')">
                                    <option value="" disabled selected>⚙️ خيارات الإجراء</option>
                                    <optgroup label="الفصول الدراسية">
                                        ${classOptionsHtml}
                                    </optgroup>
                                    <optgroup label="العمليات الأساسية">
                                        <option value="copy_email">📧 نسخ الإيميل</option>
                                        <option value="edit_email">✏️ تعديل الإيميل</option>
                                        <option value="copy_name">📋 نسخ الاسم</option>
                                        <option value="edit_name">✏️ تعديل الاسم</option>
                                        <option value="copy_both">📑 نسخ الكل (الاسم والإيميل)</option>
                                        <option value="delete">🗑️ حذف الطالب</option>
                                    </optgroup>
                                </select>
                            </td>
                        `;
                        approvedTbody.appendChild(tr);
                    }
                });
                renderView();
                searchStudents();
                if(activeClass) renderClassStudents();
            });

            db.collection("pending_students").orderBy("name").onSnapshot((snapshot) => {
                let pendingCount = snapshot.size;
                if(pendingTbody) pendingTbody.innerHTML = "";
                const pendingBadge = document.getElementById("pendingCountBadge");
                if(pendingBadge) pendingBadge.innerText = `الطلبات المعلقة: ${pendingCount}`;
                if(pendingSection) pendingSection.style.display = pendingCount > 0 ? "block" : "none";

                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const email = doc.id;
                    if(pendingTbody) {
                        pendingTbody.innerHTML += `
                            <tr>
                                <td>${data.name}</td>
                                <td>${email}</td>
                                <td>
                                    <button class="btn-approve" onclick="approveStudent('${email}', '${data.name}')">✅ قبول</button>
                                    <button class="btn-reject" onclick="deletePending('${email}')">❌ رفض</button>
                                </td>
                            </tr>`;
                    }
                });
            });
        }

        window.handleAction = async function(selectElement, email, currentName, studentId) {
            const action = selectElement.value;
            selectElement.value = ""; 

            if (action.startsWith('class_')) {
                const targetClass = action.replace('class_', '');
                await assignStudentClass(studentId, targetClass);
                return;
            }

            if (action === 'copy_email') copyText(email);
            else if (action === 'edit_email') editStudentEmail(email, currentName);
            else if (action === 'copy_name') copyText(currentName);
            else if (action === 'edit_name') editStudentName(email, currentName);
            else if (action === 'copy_both') copyText(`${currentName}\n${email}`);
            else if (action === 'delete') deleteAllowed(email);
        };

        async function assignStudentClass(studentId, newClass) {
            const student = allStudents.find(s => s.id === studentId);
            if(student) {
                student.className = newClass;
                renderView();
                if(activeClass) renderClassStudents();
                await db.collection("allowed_students").doc(studentId).update({ className: newClass });
            }
        }

        async function copyText(text) {
            try { await navigator.clipboard.writeText(text); alert("تم النسخ بنجاح!"); } 
            catch (err) { alert("فشل النسخ تلقائياً."); }
        }

        async function editStudentName(email, currentName) {
            const newName = prompt("أدخل الاسم الجديد للطالب:", currentName);
            if (newName === null) return;
            const trimmedName = newName.trim();
            if (!trimmedName) return alert("لا يمكن ترك الاسم فارغاً.");
            try { await db.collection("allowed_students").doc(email).update({ name: trimmedName }); } 
            catch (error) { alert("حدث خطأ أثناء تحديث الاسم."); }
        }

        async function editStudentEmail(currentEmail, currentName) {
            const newEmailInput = prompt("أدخل البريد الإلكتروني الجديد للطالب:", currentEmail);
            if (newEmailInput === null) return;
            const newEmail = newEmailInput.trim().toLowerCase();
            if (!newEmail || !newEmail.includes('@')) return alert("يرجى إدخال بريد إلكتروني صحيح.");
            if (newEmail === currentEmail) return;
            try {
                const docCheck = await db.collection("allowed_students").doc(newEmail).get();
                if (docCheck.exists) return alert("هذا البريد الإلكتروني موجود مسبقاً!");
                await db.collection("allowed_students").doc(newEmail).set({ name: currentName, className: 'غير موزع', added_at: firebase.firestore.FieldValue.serverTimestamp() });
                await db.collection("allowed_students").doc(currentEmail).delete();
                alert("تم تعديل الإيميل بنجاح!");
            } catch (error) { alert("حدث خطأ أثناء تحديث الإيميل."); }
        }

        async function approveStudent(email, name) {
            try {
                await db.collection("allowed_students").doc(email).set({
                    name: name,
                    className: 'غير موزع',
                    added_at: firebase.firestore.FieldValue.serverTimestamp()
                });
                await db.collection("pending_students").doc(email).delete();
            } catch (error) { alert("حدث خطأ أثناء الموافقة."); }
        }

        async function deletePending(email) {
            if(confirm(`رفض وحذف ${email} من قائمة الانتظار؟`)) {
                await db.collection("pending_students").doc(email).delete();
            }
        }

        async function deleteAllowed(email) {
            if(confirm(`حذف ${email} من الطلاب المعتمدين؟`)) {
                await db.collection("allowed_students").doc(email).delete();
            }
        }

        async function superSmartBulkAdd() {
            const input = document.getElementById("bulkInput").value.trim();
            if(!input) return alert("يرجى لصق البيانات");

            const lines = input.split('\n').map(l => l.trim()).filter(l => l !== "");
            const batch = db.batch();
            let count = 0;

            for(let i = 0; i < lines.length; i++) {
                let line1 = lines[i];
                let line2 = lines[i+1];
                if(!line2) break;

                let name = "", email = "";
                if(!line1.includes('@') && line2.includes('@')) {
                    name = line1; email = line2.toLowerCase();
                    i++;
                } else if(line1.includes('@') && !line2.includes('@')) {
                    email = line1.toLowerCase(); name = line2;
                    i++;
                }

                if(name && email) {
                    const ref = db.collection("allowed_students").doc(email);
                    batch.set(ref, { name: name, className: 'غير موزع', added_at: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
                    count++;
                }
            }

            if(count > 0) {
                await batch.commit();
                alert(`تم رفع واعتماد ${count} طالب مباشرة بنجاح!`);
                document.getElementById("bulkInput").value = "";
            } else {
                alert("تنسيق غير معروف. تأكد من وجود الاسم والإيميل في سطرين متتاليين.");
            }
        }

        async function copyAllStudents() {
            const rows = document.querySelectorAll("#studentsTable tbody tr");
            if(rows.length === 0) return alert("لا يوجد طلاب معتمدون للنسخ.");

            let textToCopy = "";
            rows.forEach(row => {
                if (row.style.display !== "none") {
                    const name = row.getAttribute("data-name");
                    const email = row.getAttribute("data-email");
                    if(name && email) textToCopy += `${name}\n${email}\n`;
                }
            });

            if(!textToCopy) return alert("لا توجد بيانات مطابقة للنسخ.");
            try {
                await navigator.clipboard.writeText(textToCopy.trim());
                alert("تم نسخ جميع الطلاب إلى الحافظة بنجاح! 📋");
            } catch (err) { alert("فشل النسخ تلقائياً."); }
        }

        async function deleteAllStudents() {
            if(!confirm("تحذير: هل أنت متأكد من مسح جميع الطلاب المعتمدين؟")) return;
            const snapshot = await db.collection("allowed_students").get();
            const batch = db.batch();
            snapshot.forEach(doc => batch.delete(doc.ref));
            await batch.commit();
            alert("تمت تصفية قائمة المعتمدين.");
        }

        function searchStudents() {
            let input = document.getElementById("searchInput");
            if(!input) return;
            let filter = input.value.toUpperCase();
            let table = document.getElementById("studentsTable");
            if(!table) return;
            let tr = table.getElementsByTagName("tr");

            for (let i = 1; i < tr.length; i++) {
                let tdName = tr[i].getElementsByTagName("td")[0];
                let tdEmail = tr[i].getElementsByTagName("td")[1];
                if (tdName || tdEmail) {
                    let txtValueName = tdName.textContent || tdName.innerText;
                    let txtValueEmail = tdEmail.textContent || tdEmail.innerText;
                    if (txtValueName.toUpperCase().indexOf(filter) > -1 || txtValueEmail.toUpperCase().indexOf(filter) > -1) {
                        tr[i].style.display = "";
                    } else {
                        tr[i].style.display = "none";
                    }
                }       
            }
        }

        window.openClass = function(className) {
            activeClass = className;
            document.getElementById('main-dashboard').classList.add('hidden');
