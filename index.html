<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام متابعة الطلاب الاحترافي - أ/ عبدالعزيز الفيفي</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <!-- استخدام سحابة الأسماء الموحدة (allowed_students) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        body { font-family: 'Tajawal', sans-serif; min-height: 100vh; transition: background 0.5s ease; }
        .click-effect:active { transform: scale(0.96); opacity: 0.8; }
        .glass-card { backdrop-filter: blur(10px); transition: all 0.5s ease; }
    </style>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBkCO7FDQXd89YDf843J4_AtvEFvzzt-R0",
            authDomain: "aztlg-494c3.firebaseapp.com",
            projectId: "aztlg-494c3",
            storageBucket: "aztlg-494c3.firebasestorage.app",
            messagingSenderId: "597051893949",
            appId: "1:597051893949:web:de5554ac900317a92b2fd4"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let activeClass = null;
        let currentStudentId = null;
        let allStudents = [];
        let customActions = [];
        let classList = ['الفصل الأول', 'الفصل الثاني', 'الفصل الثالث', 'الفصل الرابع'];
        let editingActionIndex = null;
        let editingClassIndex = null;

        const themes = [
            { name: "الذهب الأبيض", bg: "linear-gradient(135deg, #fdfbf7 0%, #eef2f3 100%)", headerBg: "bg-stone-800 text-amber-100 border-stone-700", btnPrimary: "bg-stone-800 hover:bg-stone-900 text-amber-100", cardBg: "bg-stone-50/90 border-stone-200" },
            { name: "اللؤلؤ الطبيعي", bg: "linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%)", headerBg: "bg-slate-700 text-slate-100 border-slate-600", btnPrimary: "bg-slate-700 hover:bg-slate-800 text-white", cardBg: "bg-slate-50/90 border-slate-200" },
            { name: "الكشمير الفاخر", bg: "linear-gradient(135deg, #fcfaf8 0%, #f5efe6 100%)", headerBg: "bg-amber-900 text-amber-50 border-amber-800", btnPrimary: "bg-amber-900 hover:bg-amber-950 text-amber-50", cardBg: "bg-amber-50/60 border-amber-200" },
            { name: "الفانيلا اللاتيه", bg: "linear-gradient(135deg, #faf7f2 0%, #f0eae1 100%)", headerBg: "bg-amber-950 text-orange-100 border-amber-900", btnPrimary: "bg-amber-950 hover:bg-black text-orange-100", cardBg: "bg-orange-50/50 border-orange-200" },
            { name: "السحاب الفرنسي", bg: "linear-gradient(135deg, #f4f6f9 0%, #e2e8f0 100%)", headerBg: "bg-sky-900 text-sky-50 border-sky-800", btnPrimary: "bg-sky-900 hover:bg-sky-950 text-white", cardBg: "bg-sky-50/70 border-sky-200" },
            { name: "الزمرد الخفيف", bg: "linear-gradient(135deg, #f4fcf7 0%, #e6f4ed 100%)", headerBg: "bg-emerald-900 text-emerald-50 border-emerald-800", btnPrimary: "bg-emerald-800 hover:bg-emerald-900 text-white", cardBg: "bg-emerald-50/70 border-emerald-200" }
        ];

        function applyRandomTheme() {
            const randomIndex = Math.floor(Math.random() * themes.length);
            const selectedTheme = themes[randomIndex];
            document.body.style.background = selectedTheme.bg;
            const header = document.getElementById('main-header');
            if(header) {
                header.className = `p-4 shadow-md border-b transition-all duration-500 ${selectedTheme.headerBg}`;
            }
            window.currentTheme = selectedTheme;
            renderView();
            renderClassStudents();
        }

        const defaultActions = [
            { icon: '✅', name: 'إجابة صحيحة', score: 1.0, color: '#28a745' },
            { icon: '❌', name: 'إجابة خاطئة', score: -1.0, color: '#dc3545' },
            { icon: '💡', name: 'مشاركة', score: 1.0, color: '#17a2b8' },
            { icon: '📘', name: 'حل الواجب', score: 3.0, color: '#20c997' },
            { icon: '📕', name: 'لم يحل الواجب', score: -3.0, color: '#e83e8c' },
            { icon: '💤', name: 'النوم في الحصة', score: -1.0, color: '#6610f2' },
            { icon: '🗣️', name: 'التحدث أثناء الدرس', score: -1.0, color: '#6f42c1' },
            { icon: '⭐', name: 'إنجاز ملف', score: 5.0, color: '#00cec9' },
            { icon: '🎁', name: 'هدية', score: 5.0, color: '#e17055' }
        ];

        async function initFastLoad() {
            applyRandomTheme();
            customActions = defaultActions;
            
            try {
                const snapshot = await db.collection("allowed_students").get();
                allStudents = [];
                snapshot.forEach(doc => {
                    const item = doc.data();
                    allStudents.push({
                        id: doc.id,
                        name: item.name || 'بدون اسم',
                        email: doc.id,
                        className: item.className || 'غير موزع',
                        phone: item.phone || '966566688614',
                        actions: item.actions || [],
                        attendanceStats: item.attendanceStats || { absents: 0, lates: 0, excuses: 0 }
                    });
                });
                renderView();
                renderCustomActionsUI();
                renderSettingsActionsDropdown();
                renderClassesListUI();
                
                const statusEl = document.getElementById('loading-status-text');
                if(statusEl) statusEl.innerText = `✅ تم تحميل جميع الأسماء بنجاح (${allStudents.length} طالب).`;
            } catch (e) {
                console.error("خطأ بالتحميل:", e);
                const statusEl = document.getElementById('loading-status-text');
                if(statusEl) statusEl.innerText = `❌ حدث خطأ أثناء تحميل الأسماء.`;
            }
        }

        window.openClass = function(className) {
            activeClass = className;
            document.getElementById('main-dashboard').classList.add('hidden');
            document.getElementById('class-view').classList.remove('hidden');
            document.getElementById('class-title-header').innerText = `إدارة فصل: ${className}`;
            renderClassStudents();
            closeCustomSelect();
        };

        window.backToHome = function() {
            activeClass = null;
            document.getElementById('class-view').classList.add('hidden');
            document.getElementById('main-dashboard').classList.remove('hidden');
            renderView();
        };

        window.toggleCustomSelect = function() {
            const dropdown = document.getElementById('custom-dropdown-box');
            if(dropdown.classList.contains('hidden')) {
                dropdown.classList.remove('hidden');
                document.getElementById('custom-select-search').value = '';
                renderCustomDropdownOptions('');
                setTimeout(() => document.getElementById('custom-select-search').focus(), 100);
            } else {
                closeCustomSelect();
            }
        };

        window.closeCustomSelect = function() {
            const dropdown = document.getElementById('custom-dropdown-box');
            if(dropdown) dropdown.classList.add('hidden');
        };

        window.filterCustomDropdown = function(keyword) {
            renderCustomDropdownOptions(keyword);
        };

        window.renderCustomDropdownOptions = function(keyword) {
            const listContainer = document.getElementById('custom-dropdown-list');
            if(!listContainer) return;

            const trimmed = keyword.trim().toLowerCase();
            const filtered = allStudents.filter(student => student.name.toLowerCase().includes(trimmed));

            if(filtered.length === 0) {
                listContainer.innerHTML = `<div class="p-3 text-xs text-slate-400 text-center">لا توجد نتائج مطابقة</div>`;
                return;
            }

            listContainer.innerHTML = '';
            filtered.forEach(student => {
                const statusText = student.className && student.className !== 'غير موزع' ? ` (مضاف في: ${student.className})` : ' (غير موزع)';
                listContainer.innerHTML += `
                    <div onclick="selectStudentFromCustomDropdown('${student.id}', '${student.name}')" class="p-2.5 hover:bg-slate-100 cursor-pointer border-b border-slate-100 last:border-b-0 text-xs font-bold text-slate-700 flex justify-between items-center transition">
                        <span>👤 ${student.name}</span>
                        <span class="text-[10px] text-slate-400 font-normal">${statusText}</span>
                    </div>
                `;
            });
        };

        window.selectStudentFromCustomDropdown = async function(id, name) {
            closeCustomSelect();
            const student = allStudents.find(s => s.id === id);
            if(student) {
                student.className = activeClass;
                renderClassStudents();
                document.getElementById('custom-select-display-text').innerText = `تم اختيار: ${name}`;
                await db.collection("allowed_students").doc(id).update({ className: activeClass });
            }
        };

        window.openSettingsModal = function(tabName = 'classes') {
            document.getElementById('settings-modal').classList.remove('hidden');
            document.getElementById('settings-modal').classList.add('flex');
            switchSettingsTab(tabName);
        };

        window.closeSettingsModal = function() {
            document.getElementById('settings-modal').classList.add('hidden');
            document.getElementById('settings-modal').classList.remove('flex');
            resetActionForm();
            resetClassForm();
        };

        window.switchSettingsTab = function(tab) {
            const classesTabContent = document.getElementById('classes-tab-content');
            const actionsTabContent = document.getElementById('actions-tab-content');
            const btnClasses = document.getElementById('btn-tab-classes');
            const btnActions = document.getElementById('btn-tab-actions');
            const activeColorClass = window.currentTheme ? window.currentTheme.btnPrimary.split(' ')[0] : 'bg-slate-700';

            if(tab === 'classes') {
                classesTabContent.classList.remove('hidden');
                actionsTabContent.classList.add('hidden');
                btnClasses.className = `flex-1 py-2.5 rounded-xl font-bold text-xs ${activeColorClass} text-white shadow transition-all cursor-pointer`;
                btnActions.className = "flex-1 py-2.5 rounded-xl font-bold text-xs bg-slate-100 text-slate-600 transition-all cursor-pointer";
            } else {
                classesTabContent.classList.add('hidden');
                actionsTabContent.classList.remove('hidden');
                btnActions.className = `flex-1 py-2.5 rounded-xl font-bold text-xs ${activeColorClass} text-white shadow transition-all cursor-pointer`;
                btnClasses.className = "flex-1 py-2.5 rounded-xl font-bold text-xs bg-slate-100 text-slate-600 transition-all cursor-pointer";
                renderSettingsActionsDropdown();
            }
        };

        window.saveClassItem = function() {
            const classNameInput = document.getElementById('new-class-name');
            const name = classNameInput.value.trim();
            if(!name) return alert('الرجاء إدخال اسم الفصل');

            if(editingClassIndex !== null) {
                const oldName = classList[editingClassIndex];
                classList[editingClassIndex] = name;
                allStudents.forEach(async stu => {
                    if(stu.className === oldName) {
                        stu.className = name;
                        await db.collection("allowed_students").doc(stu.id).update({ className: name });
                    }
                });
                editingClassIndex = null;
                document.getElementById('save-class-btn').innerText = "إضافة ➕";
            } else {
                if(classList.includes(name)) return alert('هذا الفصل موجود مسبقاً');
                classList.push(name);
            }

            classNameInput.value = '';
            renderClassesListUI();
            renderView();
        };

        window.editClassItem = function(index) {
            document.getElementById('new-class-name').value = classList[index];
            editingClassIndex = index;
            document.getElementById('save-class-btn').innerText = "تعديل ✏️";
        };

        window.deleteClassItem = function(index) {
            if(confirm('هل أنت متأكد من حذف هذا الفصل؟')) {
                const removedName = classList[index];
                classList.splice(index, 1);
                allStudents.forEach(async stu => {
                    if(stu.className === removedName) {
                        stu.className = 'غير موزع';
                        await db.collection("allowed_students").doc(stu.id).update({ className: 'غير موزع' });
                    }
                });
                renderClassesListUI();
                renderView();
            }
        };

        window.resetClassForm = function() {
            editingClassIndex = null;
            document.getElementById('new-class-name').value = '';
            document.getElementById('save-class-btn').innerText = "إضافة ➕";
        };

        function renderClassesListUI() {
            const container = document.getElementById('settings-classes-list');
            if(!container) return;
            container.innerHTML = '';
            classList.forEach((cls, index) => {
                container.innerHTML += `
                    <div class="bg-white p-2.5 rounded-xl border border-slate-200 flex justify-between items-center text-xs shadow-xs">
                        <span class="font-bold text-slate-700">${cls}</span>
                        <div class="flex gap-1.5">
                            <button onclick="editClassItem(${index})" class="bg-amber-50 text-amber-700 px-2 py-1 rounded-lg font-semibold cursor-pointer">✏️ تعديل</button>
                            <button onclick="deleteClassItem(${index})" class="bg-rose-50 text-rose-600 px-2 py-1 rounded-lg font-semibold cursor-pointer">🗑️ حذف</button>
                        </div>
                    </div>
                `;
            });
        }

        window.renderSettingsActionsDropdown = function() {
            const selectEl = document.getElementById('actions-dropdown-select');
            if(!selectEl) return;
            selectEl.innerHTML = `<option value="">-- اختر تقييماً للتعديل أو أضف جديداً --</option>`;
            if (customActions && customActions.length > 0) {
                customActions.forEach((act, index) => {
                    const scoreText = act.score > 0 ? '+' + act.score : act.score;
                    selectEl.innerHTML += `<option value="${index}">${act.icon || '⭐'} ${act.name} (${scoreText})</option>`;
                });
            }
        };

        window.onSelectActionToEdit = function() {
            const index = document.getElementById('actions-dropdown-select').value;
            if(index === "") {
                resetActionForm();
                return;
            }
            const act = customActions[index];
            if(!act) return;
            
            document.getElementById('new-action-icon').value = act.icon || '⭐';
            document.getElementById('new-action-name').value = act.name;
            document.getElementById('new-action-score').value = act.score;
            document.getElementById('new-action-color').value = act.color;
            editingActionIndex = parseInt(index);
            document.getElementById('save-action-btn').innerText = "تعديل التقييم ✏️";
            document.getElementById('delete-action-btn').classList.remove('hidden');
        };

        window.saveCustomActionFromDropdown = function() {
            const icon = document.getElementById('new-action-icon').value;
            const name = document.getElementById('new-action-name').value.trim();
            const score = parseFloat(document.getElementById('new-action-score').value);
            const color = document.getElementById('new-action-color').value;

            if(!name || isNaN(score)) return alert('الرجاء إدخال اسم التقييم والدرجة بشكل صحيح.');

            const newActObj = { icon, name, score, color };

            if(editingActionIndex !== null && editingActionIndex >= 0) {
                customActions[editingActionIndex] = newActObj;
            } else {
                customActions.push(newActObj);
            }

            renderCustomActionsUI();
            renderSettingsActionsDropdown();
            resetActionForm();
            alert('تم حفظ التقييم بنجاح ✅');
        };

        window.deleteSelectedAction = function() {
            if(editingActionIndex === null || editingActionIndex < 0) return alert('الرجاء اختيار تقييم من القائمة أولاً للحذف');
            if(confirm('هل أنت متأكد من حذف هذا التقييم؟')) {
                customActions.splice(editingActionIndex, 1);
                renderCustomActionsUI();
                renderSettingsActionsDropdown();
                resetActionForm();
                alert('تم الحذف بنجاح 🗑️');
            }
        };

        window.resetActionForm = function() {
            editingActionIndex = null;
            const selectEl = document.getElementById('actions-dropdown-select');
            if(selectEl) selectEl.value = "";
            document.getElementById('new-action-name').value = '';
            document.getElementById('new-action-score').value = '';
            document.getElementById('new-action-icon').value = '⭐';
            document.getElementById('save-action-btn').innerText = "حفظ كتقييم جديد 🚀";
            document.getElementById('delete-action-btn').classList.add('hidden');
        };

        window.renderCustomActionsUI = function() {
            const container = document.getElementById('custom-actions-container');
            if(!container) return;
            container.innerHTML = '';
            
            customActions.forEach(act => {
                const fullName = `${act.icon \vert{}\vert{} ''}${act.name}`.trim();
                const actColor = act.color || '#64748b';
                
                container.innerHTML += `
                    <div class="bg-white p-2.5 rounded-xl border border-slate-100 flex items-center justify-between shadow-xs hover:shadow transition">
                        <button onclick="recordAction('${fullName}',${act.score}, null)" class="flex items-center gap-2.5 flex-grow text-right cursor-pointer">
                            <span class="w-9 h-9 rounded-lg flex items-center justify-center text-base border" style="background-color: ${actColor}15; border-color:${actColor}40;">
                                ${act.icon || '⭐'}
                            </span>
                            <span class="font-bold text-xs text-slate-700">${act.name}</span>
                        </button>
                        <span class="text-[11px] font-bold px-2 py-0.5 rounded-md bg-slate-100 text-slate-600">${act.score > 0 ? '+' + act.score : act.score}</span>
                    </div>
                `;
            });
        }

        window.removeStudentFromClass = async function(id) {
            const student = allStudents.find(s => s.id === id);
            if(!student) return;
            if(confirm(`هل أنت متأكد من إزالة الطالب (${student.name}) من هذا الفصل؟`)) {
                student.className = 'غير موزع';
                renderClassStudents();
                renderView();
                await db.collection("allowed_students").doc(id).update({ className: 'غير موزع' });
            }
        };

        window.recordAction = async function(actionName, scoreChange = 0, attendanceType = null) {
            if(!currentStudentId) return;
            closeActionModal();

            const student = allStudents.find(s => s.id === currentStudentId);
            if(student) {
                const now = new Date();
                const dayName = now.toLocaleDateString('ar-SA', { weekday: 'long' });
                const dateFormatted = now.toLocaleDateString('ar-SA', { year: 'numeric', month: '2-digit', day: '2-digit' });
                const timeFormatted = now.toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' });
                const formattedTime = `${dayName} | ${dateFormatted} -${timeFormatted}`;

                let attendanceStats = student.attendanceStats || { absents: 0, lates: 0, excuses: 0 };
                if(attendanceType) {
                    if(attendanceType === 'غائب') attendanceStats.absents++;
                    if(attendanceType === 'متأخر') attendanceStats.lates++;
                    if(attendanceType === 'مستأذن') attendanceStats.excuses++;
                }
                
                const newRecord = { title: actionName, score: scoreChange, timestamp: formattedTime };
                student.actions = [newRecord, ...(student.actions || [])];

                renderClassStudents();

                await db.collection("allowed_students").doc(currentStudentId).update({
                    actions: student.actions,
                    attendanceStats: attendanceStats
                });
            }
        };

        window.deleteStudentAction = async function(actionIndex) {
            if(!currentStudentId) return;
            const student = allStudents.find(s => s.id === currentStudentId);
            if(student && student.actions) {
                student.actions.splice(actionIndex, 1);
                openModal(currentStudentId);
                renderClassStudents();
                await db.collection("allowed_students").doc(currentStudentId).update({ actions: student.actions });
            }
        };

        window.adjustAttendance = async function(type, delta) {
            if(!currentStudentId) return;
            const student = allStudents.find(s => s.id === currentStudentId);
            if(student) {
                let att = student.attendanceStats || { absents: 0, lates: 0, excuses: 0 };
                if(type === 'absents') att.absents = Math.max(0, (att.absents || 0) + delta);
                if(type === 'lates') att.lates = Math.max(0, (att.lates || 0) + delta);
                if(type === 'excuses') att.excuses = Math.max(0, (att.excuses || 0) + delta);

                openModal(currentStudentId);
                await db.collection("allowed_students").doc(currentStudentId).update({ attendanceStats: att });
            }
        };

        function renderView() {
            const classesContainer = document.getElementById('dynamic-classes-grid');
            if(!classesContainer) return;
            classesContainer.innerHTML = '';

            classList.forEach(cls => {
                const count = allStudents.filter(s => s.className === cls).length;
                const cardBgClass = window.currentTheme ? window.currentTheme.cardBg : 'bg-white/95';
                classesContainer.innerHTML += `
                    <div onclick="openClass('${cls}')" class="glass-card p-4 rounded-2xl shadow-sm border hover:border-slate-400 cursor-pointer transition flex items-center justify-between ${cardBgClass}">
                        <div>
                            <span class="text-2xl mb-1 block">📚</span>
                            <h3 class="text-base font-bold text-slate-800">${cls}</h3>
                            <p class="text-xs text-slate-500 mt-0.5">${count} طلاب مخصصين</p>
                        </div>
                        <span class="bg-slate-100 text-slate-700 w-9 h-9 rounded-xl flex items-center justify-center font-bold text-sm shadow-2xs">➔</span>
                    </div>
                `;
            });
        }

        function renderClassStudents() {
            if(!activeClass) return;
            const container = document.getElementById('class-students-container');
            if(!container) return;
            container.innerHTML = '';
            const students = allStudents.filter(s => s.className === activeClass);

            if(students.length === 0) {
                container.innerHTML = `<p class="text-slate-500 col-span-2 text-center py-8 font-semibold bg-white rounded-2xl shadow-2xs text-xs">لا توجد طلاب مخصصين في هذا الفصل حالياً. استخدم القائمة المنسدلة بالأعلى للإضافة.</p>`;
                return;
            }

            students.forEach(student => {
                const btnPrimaryClass = window.currentTheme ? window.currentTheme.btnPrimary.split(' ')[0] : 'bg-slate-700';
                const cardBgClass = window.currentTheme ? window.currentTheme.cardBg : 'bg-white';
                
                let totalScore = 0;
                if(student.actions && Array.isArray(student.actions)) {
                    student.actions.forEach(act => {
                        totalScore += (parseFloat(act.score) || 0);
                    });
                }

                let scoreBadgeBg = "bg-slate-100 text-slate-700 border-slate-200";
                if(totalScore > 0) scoreBadgeBg = "bg-emerald-50 text-emerald-700 border-emerald-200";
                if(totalScore < 0) scoreBadgeBg = "bg-rose-50 text-rose-700 border-rose-200";
                const formattedScore = totalScore > 0 ? `+${totalScore}` : totalScore;

                container.innerHTML += `
                    <div class="p-3.5 rounded-2xl shadow-2xs flex items-center justify-between border transition ${cardBgClass}">
                        <div>
                            <div class="flex items-center gap-2">
                                <h3 class="font-bold text-sm text-slate-800">${student.name}</h3>
                                <span class="text-[11px] font-black px-2 py-0.5 rounded-lg border ${scoreBadgeBg}" title="مجموع التقييمات">⭐ ${formattedScore}</span>
                            </div>
                            <p class="text-[11px] text-slate-500 font-medium mt-0.5">${student.email || 'بدون إيميل'}</p>
                        </div>
                        <div class="flex gap-1.5 items-center">
                            <button onclick="openActionModal('${student.id}')" class="${btnPrimaryClass} text-white px-3 py-1.5 rounded-xl text-xs font-bold shadow-2xs cursor-pointer transition">📝 رصد</button>
                            <button onclick="openModal('${student.id}')" class="bg-emerald-600 text-white px-3 py-1.5 rounded-xl text-xs font-bold shadow-2xs hover:bg-emerald-700 cursor-pointer transition">📊 التقرير</button>
                            <button onclick="removeStudentFromClass('${student.id}')" title="إزالة الطالب من الفصل" class="bg-rose-50 text-rose-600 px-2.5 py-1.5 rounded-xl text-xs font-bold hover:bg-rose-100 cursor-pointer transition">🗑️</button>
                        </div>
                    </div>
                `;
            });
        }
