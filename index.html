<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام متابعة الطلاب - الأستاذ عبدالعزيز الفيفي</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
    <!-- استيراد مكتبات Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // إعدادات مشروعك السحابي من Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAVrIim7aXjg0hGrMk0qVrXT8gaRIpHoBk",
            authDomain: "youy-apps.firebaseapp.com",
            databaseURL: "https://youy-apps-default-rtdb.firebaseio.com",
            projectId: "youy-apps",
            storageBucket: "youy-apps.firebasestorage.app",
            messagingSenderId: "690543747528",
            appId: "1:690543747528:web:10c85ef0c93b79596620fd",
            measurementId: "G-LL8PGM8G8E"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let activeClass = 'الفصل الأول';
        let currentStudentId = null;
        let allStudents = [];

        // جلب البيانات من السحابة لحظياً
        window.initRealtimeSync = function() {
            onSnapshot(collection(db, "fifi_students_tracker"), (snapshot) => {
                allStudents = [];
                snapshot.forEach((docSnap) => {
                    allStudents.push({ id: docSnap.id, ...docSnap.data() });
                });
                renderStudents();
            });
        };

        window.switchClass = function(className) {
            activeClass = className;
            document.querySelectorAll('.class-btn').forEach(btn => {
                if(btn.innerText.includes(className.replace('الفصل ', 'أول ثانوي/'))) {
                    btn.className = "class-btn px-4 py-2 bg-indigo-600 text-white rounded-xl font-bold shadow transition";
                } else {
                    btn.className = "class-btn px-4 py-2 bg-white text-indigo-600 border border-indigo-300 rounded-xl font-bold shadow transition";
                }
            });
            document.getElementById('current-class-title').innerText = `إدارة طلاب: ${className}`;
            renderStudents();
        };

        // إضافة الطلاب دفعة واحدة (كل سطر: الاسم | الإيميل)
        window.addBulkStudents = async function() {
            const bulkText = document.getElementById('bulk-students-input').value.trim();
            if(!bulkText) return alert('الرجاء إدخال قائمة الطلاب في المربع');

            const lines = bulkText.split('\n');
            let count = 0;

            for (let line of lines) {
                const parts = line.split('|');
                const name = parts[0] ? parts[0].trim() : '';
                const email = parts[1] ? parts[1].trim() : 'غير متوفر';

                if(name) {
                    try {
                        await addDoc(collection(db, "fifi_students_tracker"), {
                            name: name,
                            email: email,
                            className: activeClass,
                            phone: '966566688614',
                            actions: ['بداية المتابعة'],
                            attendance: 'حاضر',
                            createdAt: new Date()
                        });
                        count++;
                    } catch (e) {
                        console.error(e);
                    }
                }
            }

            document.getElementById('bulk-students-input').value = '';
            alert(`تم بنجاح إضافة ${count} طالب إلى ${activeClass}!`);
        };

        window.deleteStudent = async function(id) {
            if(confirm('هل أنت متأكد من حذف هذا الطالب من السحابة؟')) {
                try {
                    await deleteDoc(doc(db, "fifi_students_tracker", id));
                } catch (e) {
                    alert('خطأ في الحذف: ' + e.message);
                }
            }
        };

        window.recordAction = async function(actionName) {
            if(!currentStudentId) return;
            const student = allStudents.find(s => s.id === currentStudentId);
            if(student) {
                const updatedActions = [actionName, ...(student.actions || [])];
                try {
                    await updateDoc(doc(db, "fifi_students_tracker", currentStudentId), {
                        actions: updatedActions
                    });
                    closeActionModal();
                } catch (e) {
                    alert('خطأ في التحديث: ' + e.message);
                }
            }
        };

        window.filterStudents = function() {
            renderStudents();
        };

        function renderStudents() {
            const container = document.getElementById('students-container');
            container.innerHTML = '';
            
            const searchQuery = document.getElementById('search-student').value.trim().toLowerCase();
            
            // جلب طلاب الفصل الحالي أو مطابقة البحث العام
            const students = allStudents.filter(s => {
                const inClass = s.className === activeClass;
                const matchesSearch = s.name.toLowerCase().includes(searchQuery) || (s.email && s.email.toLowerCase().includes(searchQuery));
                if(searchQuery) {
                    return matchesSearch; // البحث يشمل الجميع أو حسب الرغبة
                }
                return inClass;
            });

            if(students.length === 0) {
                container.innerHTML = `<p class="text-gray-500 col-span-2 text-center py-8">لا توجد طلاب مطابقين للبحث أو مضافين في هذا الفصل حالياً.</p>`;
                return;
            }

            students.forEach(student => {
                container.innerHTML += `
                    <div class="bg-white p-4 rounded-2xl shadow flex items-center justify-between border border-gray-100">
                        <div>
                            <h3 class="font-bold text-lg text-gray-800">${student.name}</h3>
                            <p class="text-xs text-indigo-600 font-semibold">${student.className} | <span class="text-gray-500">${student.email || 'بدون إيميل'}</span></p>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="openActionModal('${student.id}')" class="bg-indigo-50 text-indigo-600 px-3 py-1.5 rounded-xl text-sm font-bold hover:bg-indigo-100 transition">📝 رصد</button>
                            <button onclick="openModal('${student.id}')" class="bg-emerald-50 text-emerald-600 px-3 py-1.5 rounded-xl text-sm font-bold hover:bg-emerald-100 transition">📊 الملف</button>
                            <button onclick="deleteStudent('${student.id}')" class="text-red-400 hover:text-red-600 p-1">🗑️</button>
                        </div>
                    </div>
                `;
            });
        }

        window.openActionModal = function(id) {
            currentStudentId = id;
            document.getElementById('action-modal').classList.remove('hidden');
            document.getElementById('action-modal').classList.add('flex');
        };

        window.closeActionModal = function() {
            document.getElementById('action-modal').classList.add('hidden');
            document.getElementById('action-modal').classList.remove('flex');
        };

        window.openModal = function(id) {
            const student = allStudents.find(s => s.id === id);
            if(!student) return;

            const modalContent = document.getElementById('modal-content');
            modalContent.innerHTML = `
                <div class="text-center mb-6">
                    <div class="w-20 h-20 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center text-3xl font-bold mx-auto mb-2 shadow-inner">👤</div>
                    <h2 class="text-xl font-bold text-gray-900">${student.name}</h2>
                    <p class="text-sm text-gray-500">${student.className} - ${student.email || ''}</p>
                    <a href="https://wa.me/${student.phone}" target="_blank" class="inline-block mt-2 bg-green-50 text-green-600 px-4 py-1.5 rounded-full text-xs font-bold border border-green-200">💬 بطاقة وصول ولي الأمر</a>
                </div>

                <div class="bg-indigo-50/50 p-4 rounded-2xl mb-4 border border-indigo-100">
                    <h4 class="font-bold text-indigo-900 text-sm mb-1">📌 ملخص الأداء</h4>
                    <p class="text-xs text-gray-600 leading-relaxed">يظهر الطالب تفاعلاً ومستوى في المتابعة المستمرة عبر السحابة، مع رصد السلوكيات والأنشطة اليومية.</p>
                </div>

                <div class="mb-4">
                    <h4 class="font-bold text-gray-800 text-sm mb-2">🕒 النشاطات الأخيرة والسلوكيات</h4>
                    <div class="space-y-2 max-h-40 overflow-y-auto pr-1">
                        ${(student.actions || []).map(act => `<div class="bg-gray-50 p-2 rounded-xl text-xs flex justify-between items-center border"><span class="font-semibold text-gray-700">${act}</span><span class="text-gray-400 text-[10px]">محدث سحابياً</span></div>`).join('')}
                    </div>
                </div>

                <button onclick="closeModal()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700 transition">إغلاق الملف</button>
            `;

            document.getElementById('student-modal').classList.remove('hidden');
            document.getElementById('student-modal').classList.add('flex');
        };

        window.closeModal = function() {
            document.getElementById('student-modal').classList.add('hidden');
            document.getElementById('student-modal').classList.remove('flex');
        };

        window.onload = function() {
            initRealtimeSync();
        };
    </script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen">

    <header class="bg-indigo-600 text-white p-4 shadow-md text-center">
        <h1 class="text-2xl font-bold">نظام المتابعة السحابي للطلاب</h1>
        <p class="text-sm opacity-90">المعلم: عبدالعزيز الفيفي | الكفايات اللغوية</p>
    </header>

    <main class="container mx-auto p-4 max-w-4xl">
        <!-- أزرار الفصول -->
        <div class="flex justify-center gap-2 mb-6 overflow-x-auto py-2">
            <button onclick="switchClass('الفصل الأول')" class="class-btn px-4 py-2 bg-indigo-600 text-white rounded-xl font-bold shadow transition">أول ثانوي/1</button>
            <button onclick="switchClass('الفصل الثاني')" class="class-btn px-4 py-2 bg-white text-indigo-600 border border-indigo-300 rounded-xl font-bold shadow transition">أول ثانوي/2</button>
            <button onclick="switchClass('الفصل الثالث')" class="class-btn px-4 py-2 bg-white text-indigo-600 border border-indigo-300 rounded-xl font-bold shadow transition">أول ثانوي/3</button>
            <button onclick="switchClass('الفصل الرابع')" class="class-btn px-4 py-2 bg-white text-indigo-600 border border-indigo-300 rounded-xl font-bold shadow transition">أول ثانوي/4</button>
        </div>

        <!-- قسم إضافة الطلاب دفعة واحدة (اسم الطالب | إيميل مدرستي) -->
        <div class="bg-white p-5 rounded-2xl shadow mb-6 border border-indigo-50">
            <h2 class="font-bold text-lg text-indigo-700 mb-2" id="current-class-title">إضافة دفعة طلاب لـ: الفصل الأول</h2>
            <p class="text-xs text-gray-500 mb-3">ضع كل طالب في سطر مستقل بالصيغة التالية: <code class="bg-gray-100 p-1 rounded text-indigo-600">اسم الطالب | إيميل منصة مدرستي</code></p>
            <textarea id="bulk-students-input" rows="4" placeholder="محمد أحمد الفيفي | m.feefi@moe.gov.sa&#10;علي خالد العمري | a.amri@moe.gov.sa" class="w-full border p-3 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 mb-3"></textarea>
            <button onclick="addBulkStudents()" class="bg-green-600 text-white px-6 py-2.5 rounded-xl font-bold hover:bg-green-700 transition text-sm">حفظ وإضافة الدفعة للفصل</button>
        </div>

        <!-- شريط البحث السريع والفلترة -->
        <div class="bg-white p-4 rounded-2xl shadow mb-6 flex items-center gap-3">
            <span class="text-xl">🔍</span>
            <input type="text" id="search-student" oninput="filterStudents()" placeholder="ابحث باسم الطالب أو الإيميل..." class="w-full border-none focus:outline-none text-sm">
        </div>

        <!-- قائمة الطلاب -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="students-container">
            <!-- يتم تعبئة الطلاب من السحابة هنا -->
        </div>
    </main>

    <!-- نافذة ملف الطالب المفصل -->
    <div id="student-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl max-w-lg w-full max-h-[90vh] overflow-y-auto p-6 relative shadow-2xl">
            <button onclick="closeModal()" class="absolute top-4 left-4 bg-gray-200 text-gray-700 w-8 h-8 rounded-full font-bold flex items-center justify-center hover:bg-gray-300">✕</button>
            <div id="modal-content"></div>
        </div>
    </div>

    <!-- نافذة رصد السلوكيات -->
    <div id="action-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 relative shadow-2xl">
            <h3 class="text-lg font-bold text-center mb-4 text-indigo-700">تسجيل تفاعل للطالب</h3>
            <div class="grid grid-cols-2 gap-2 mb-4">
                <button onclick="recordAction('حاضر')" class="p-3 rounded-xl bg-green-500 text-white font-bold text-sm">حاضر</button>
                <button onclick="recordAction('غائب')" class="p-3 rounded-xl bg-red-500 text-white font-bold text-sm">غائب</button>
                <button onclick="recordAction('مشاركة')" class="p-3 rounded-xl bg-cyan-500 text-white font-bold text-sm">مشاركة (+)</button>
                <button onclick="recordAction('حل الواجب')" class="p-3 rounded-xl bg-emerald-600 text-white font-bold text-sm">حل الواجب</button>
                <button onclick="recordAction('لم يحل الواجب')" class="p-3 rounded-xl bg-rose-600 text-white font-bold text-sm">لم يحل الواجب (-)</button>
                <button onclick="recordAction('النوم في الحصة')" class="p-3 rounded-xl bg-purple-600 text-white font-bold text-sm">نوم في الحصة</button>
                <button onclick="recordAction('إنجاز ملف')" class="p-3 rounded-xl bg-teal-500 text-white font-bold text-sm">إنجاز ملف</button>
                <button onclick="recordAction('مشاغب / غير مهتم')" class="p-3 rounded-xl bg-amber-500 text-white font-bold text-sm">مشاغب / غير مهتم</button>
            </div>
            <button onclick="closeActionModal()" class="w-full bg-gray-300 text-gray-700 p-2 rounded-xl font-bold">إلغاء</button>
        </div>
    </div>
</body>
</html>
