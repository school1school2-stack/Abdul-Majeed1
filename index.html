<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام متابعة الطلاب الاحترافي - أ/ عبدالعزيز الفيفي</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%); min-height: 100vh; }
        .click-effect:active { transform: scale(0.96); opacity: 0.8; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
    </style>
    <!-- استيراد مكتبات Firebase (Realtime Database) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, push, remove, update, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAVrIIm7aXjg0hGrMk0qVrXT8gaRIpHoBk",
            authDomain: "youy-apps.firebaseapp.com",
            databaseURL: "https://youy-apps-default-rtdb.firebaseio.com",
            projectId: "youy-apps",
            storageBucket: "youy-apps.firebasestorage.app",
            messagingSenderId: "690543747528",
            appId: "1:690543747528:web:10c85ef0c93b79596620fd",
            measurementId: "G-LL8PGM8G8E"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let activeClass = null;
        let currentStudentId = null;
        let allStudents = [];
        let customActions = [];
        let classList = ['الفصل الأول', 'الفصل الثاني', 'الفصل الثالث', 'الفصل الرابع'];
        let editingActionId = null;
        let editingClassIndex = null;

        const defaultActions = [
            { id: 'def_1', icon: '✅', name: 'إجابة صحيحة', score: 1.0, color: '#28a745' },
            { id: 'def_2', icon: '❌', name: 'إجابة خاطئة', score: -1.0, color: '#dc3545' },
            { id: 'def_3', icon: '💡', name: 'مشاركة', score: 1.0, color: '#17a2b8' },
            { id: 'def_4', icon: '📘', name: 'حل الواجب', score: 3.0, color: '#20c997' },
            { id: 'def_5', icon: '📕', name: 'لم يحل الواجب', score: -3.0, color: '#e83e8c' },
            { id: 'def_6', icon: '💤', name: 'النوم في الحصة', score: -1.0, color: '#6610f2' },
            { id: 'def_7', icon: '🗣️', name: 'التحدث أثناء الدرس', score: -1.0, color: '#6f42c1' },
            { id: 'def_8', icon: '🏃‍♂️', name: 'خرج ولم يعد', score: -1.0, color: '#007bff' },
            { id: 'def_9', icon: '😑', name: 'غير مهتم', score: -1.0, color: '#fd7e14' },
            { id: 'def_10', icon: '📁', name: 'نسيان ملف أو واجب', score: -5.0, color: '#ffc107' },
            { id: 'def_11', icon: '📱', name: 'استخدام الهاتف', score: -1.0, color: '#d9534f' },
            { id: 'def_12', icon: '⭐', name: 'إنجاز ملف', score: 5.0, color: '#00cec9' },
            { id: 'def_13', icon: '🎁', name: 'هدية', score: 5.0, color: '#e17055' }
        ];

        window.initFastLoad = async function() {
            const dbRef = ref(db);
            try {
                const studentsSnap = await get(child(dbRef, 'fifi_students_tracker'));
                if (studentsSnap.exists()) {
                    allStudents = [];
                    const data = studentsSnap.val();
                    Object.keys(data).forEach((key) => {
                        const studentItem = data[key];
                        allStudents.push({ 
                            id: key, 
                            name: studentItem.name || 'بدون اسم',
                            email: studentItem.email || 'بدون إيميل',
                            className: studentItem.className || 'غير موزع',
                            phone: studentItem.phone || '966566688614',
                            actions: studentItem.actions || [],
                            attendanceStats: studentItem.attendanceStats || { absents: 0, lates: 0, excuses: 0 }
                        });
                    });
                }

                const settingsSnap = await get(child(dbRef, 'fifi_custom_actions'));
                if (settingsSnap.exists()) {
                    customActions = [];
                    const data = settingsSnap.val();
                    if(Array.isArray(data)) {
                        customActions = data;
                    } else {
                        Object.keys(data).forEach((key) => {
                            customActions.push({ id: key, ...data[key] });
                        });
                    }
                }
                
                // إذا كانت القائمة فارغة أو أقل من الافتراضية، يتم ضبطها بالكامل
                if(customActions.length < 5) {
                    customActions = defaultActions;
                    set(ref(db, 'fifi_custom_actions'), defaultActions);
                }

                const classesSnap = await get(child(dbRef, 'fifi_classes_list'));
                if (classesSnap.exists()) {
                    classList = classesSnap.val();
                }

                renderView();
                renderCustomActionsUI();
                renderSettingsActionsList();
                renderClassesListUI();
            } catch (error) {
                console.error("خطأ في التحميل: ", error);
            }
        };

        window.openClass = function(className) {
            activeClass = className;
            document.getElementById('main-dashboard').classList.add('hidden');
            document.getElementById('class-view').classList.remove('hidden');
            document.getElementById('class-title-header').innerText = `إدارة فصل: ${className}`;
            renderClassStudents();
        };

        window.backToHome = function() {
            activeClass = null;
            document.getElementById('class-view').classList.add('hidden');
            document.getElementById('main-dashboard').classList.remove('hidden');
            renderView();
        };

        window.openSettingsModal = function(tabName = 'classes') {
            document.getElementById('settings-modal').classList.remove('hidden');
            document.getElementById('settings-modal').classList.add('flex');
            switchSettingsTab(tabName);
        };

        window.closeSettingsModal = function() {
            document.getElementById('settings-modal').classList.add('hidden');
            document.getElementById('settings-modal').classList.remove('flex');
            resetActionForm();
            resetClassForm();
        };

        window.switchSettingsTab = function(tab) {
            const classesTabContent = document.getElementById('classes-tab-content');
            const actionsTabContent = document.getElementById('actions-tab-content');
            const btnClasses = document.getElementById('btn-tab-classes');
            const btnActions = document.getElementById('btn-tab-actions');

            if(tab === 'classes') {
                classesTabContent.classList.remove('hidden');
                actionsTabContent.classList.add('hidden');
                btnClasses.className = "flex-1 py-2.5 rounded-2xl font-black text-xs bg-indigo-600 text-white shadow transition-all cursor-pointer";
                btnActions.className = "flex-1 py-2.5 rounded-2xl font-black text-xs bg-gray-200 text-gray-700 transition-all cursor-pointer";
            } else {
                classesTabContent.classList.add('hidden');
                actionsTabContent.classList.remove('hidden');
                btnActions.className = "flex-1 py-2.5 rounded-2xl font-black text-xs bg-indigo-600 text-white shadow transition-all cursor-pointer";
                btnClasses.className = "flex-1 py-2.5 rounded-2xl font-black text-xs bg-gray-200 text-gray-700 transition-all cursor-pointer";
            }
        };

        // إدارة الفصول
        window.saveClassItem = function() {
            const classNameInput = document.getElementById('new-class-name');
            const name = classNameInput.value.trim();
            if(!name) return alert('الرجاء إدخال اسم الفصل');

            if(editingClassIndex !== null) {
                const oldName = classList[editingClassIndex];
                classList[editingClassIndex] = name;
                allStudents.forEach(stu => {
                    if(stu.className === oldName) stu.className = name;
                });
                editingClassIndex = null;
                document.getElementById('save-class-btn').innerText = "إضافة ➕";
            } else {
                if(classList.includes(name)) return alert('هذا الفصل موجود مسبقاً');
                classList.push(name);
            }

            classNameInput.value = '';
            renderClassesListUI();
            renderView();
            set(ref(db, 'fifi_classes_list'), classList);
        };

        window.editClassItem = function(index) {
            document.getElementById('new-class-name').value = classList[index];
            editingClassIndex = index;
            document.getElementById('save-class-btn').innerText = "تعديل ✏️";
        };

        window.deleteClassItem = function(index) {
            if(confirm('هل أنت متأكد من حذف هذا الفصل؟')) {
                const removedName = classList[index];
                classList.splice(index, 1);
                allStudents.forEach(stu => {
                    if(stu.className === removedName) stu.className = 'غير موزع';
                });
                renderClassesListUI();
                renderView();
                set(ref(db, 'fifi_classes_list'), classList);
            }
        };

        window.resetClassForm = function() {
            editingClassIndex = null;
            document.getElementById('new-class-name').value = '';
            document.getElementById('save-class-btn').innerText = "إضافة ➕";
        };

        function renderClassesListUI() {
            const container = document.getElementById('settings-classes-list');
            if(!container) return;
            container.innerHTML = '';
            classList.forEach((cls, index) => {
                container.innerHTML += `
                    <div class="bg-white p-3 rounded-xl border flex justify-between items-center text-sm shadow-sm">
                        <span class="font-bold text-gray-800">${cls}</span>
                        <div class="flex gap-1.5">
                            <button onclick="editClassItem(${index})" class="bg-amber-50 text-amber-700 px-2.5 py-1 rounded-lg text-xs font-bold cursor-pointer">✏️ تعديل</button>
                            <button onclick="deleteClassItem(${index})" class="bg-rose-50 text-rose-600 px-2.5 py-1 rounded-lg text-xs font-bold cursor-pointer">🗑️ حذف</button>
                        </div>
                    </div>
                `;
            });
        }

        // إدارة أدوات الرصد
        window.saveCustomAction = async function() {
            const icon = document.getElementById('new-action-icon').value;
            const name = document.getElementById('new-action-name').value.trim();
            const score = parseFloat(document.getElementById('new-action-score').value);
            const color = document.getElementById('new-action-color').value;

            if(!name || isNaN(score)) return alert('الرجاء إدخال اسم التقييم والدرجة بشكل صحيح.');

            const newObj = { id: 'act_' + Date.now(), icon, name, score, color };
            
            if(editingActionId) {
                const act = customActions.find(a => a.id === editingActionId);
                if(act) { act.icon = icon; act.name = name; act.score = score; act.color = color; }
                editingActionId = null;
            } else {
                customActions.push(newObj);
            }

            renderCustomActionsUI();
            renderSettingsActionsList();
            resetActionForm();
            set(ref(db, 'fifi_custom_actions'), customActions);
        };

        window.editCustomAction = function(id) {
            const act = customActions.find(a => a.id === id);
            if(!act) return;
            document.getElementById('new-action-icon').value = act.icon || '⭐';
            document.getElementById('new-action-name').value = act.name;
            document.getElementById('new-action-score').value = act.score;
            document.getElementById('new-action-color').value = act.color;
            editingActionId = id;
            document.getElementById('save-action-btn').innerText = "تعديل التقييم ✏️";
            document.getElementById('cancel-edit-btn').classList.remove('hidden');
        };

        window.resetActionForm = function() {
            editingActionId = null;
            document.getElementById('new-action-name').value = '';
            document.getElementById('new-action-score').value = '';
            document.getElementById('new-action-icon').value = '⭐';
            document.getElementById('save-action-btn').innerText = "حفظ التقييم 🚀";
            document.getElementById('cancel-edit-btn').classList.add('hidden');
        };

        window.deleteCustomAction = async function(id) {
            if(confirm('هل أنت متأكد من حذف أداة الرصد هذه؟')) {
                customActions = customActions.filter(a => a.id !== id);
                renderCustomActionsUI();
                renderSettingsActionsList();
                set(ref(db, 'fifi_custom_actions'), customActions);
            }
        };

        function renderSettingsActionsList() {
            const listContainer = document.getElementById('settings-actions-list');
            if(!listContainer) return;
            listContainer.innerHTML = '';
            customActions.forEach(act => {
                listContainer.innerHTML += `
                    <div class="bg-white p-3 rounded-xl border flex justify-between items-center text-sm shadow-sm">
                        <div class="flex items-center gap-2">
                            <span class="text-lg">${act.icon || '⭐'}</span>
                            <div>
                                <span class="font-bold text-gray-800 block">${act.name}</span>
                                <span class="text-xs text-gray-500">الدرجة: ${act.score}</span>
                            </div>
                        </div>
                        <div class="flex gap-1.5">
                            <button onclick="editCustomAction('${act.id}')" class="bg-amber-50 text-amber-700 px-2.5 py-1 rounded-lg text-xs font-bold cursor-pointer">✏️ تعديل</button>
                            <button onclick="deleteCustomAction('${act.id}')" class="bg-rose-50 text-rose-600 px-2.5 py-1 rounded-lg text-xs font-bold cursor-pointer">🗑️ حذف</button>
                        </div>
                    </div>
                `;
            });
        }

        // عرض شبكة التقييمات كاملة ومنسقة مثل الصورة الثانية
        function renderCustomActionsUI() {
            const container = document.getElementById('custom-actions-container');
            if(!container) return;
            container.innerHTML = '';
            
            customActions.forEach(act => {
                const fullName = `${act.icon || ''} ${act.name}`.trim();
                container.innerHTML += `
                    <div class="bg-white p-3 rounded-2xl border border-gray-100 flex items-center justify-between shadow-sm hover:shadow transition">
                        <button onclick="recordAction('${fullName}', ${act.score}, null)" class="flex items-center gap-2.5 flex-grow text-right cursor-pointer">
                            <span class="w-8 h-8 rounded-xl flex items-center justify-center text-white text-sm font-bold shadow-sm" style="background-color: ${act.color};">${act.icon || '⭐'}</span>
                            <span class="font-bold text-xs text-gray-800">${act.name}</span>
                        </button>
                        <span class="text-[11px] font-black px-2 py-1 rounded-xl bg-gray-100 text-gray-700">${act.score > 0 ? '+' + act.score : act.score}</span>
                    </div>
                `;
            });
        }

        window.superSmartBulkAdd = async function() {
            const bulkText = document.getElementById('bulk-students-input').value.trim();
            if(!bulkText) return alert('الرجاء إدخال قائمة الطلاب في المربع');
            const lines = bulkText.split('\n').map(l => l.trim()).filter(l => l !== "");
            let count = 0;
            const studentsRef = ref(db, 'fifi_students_tracker');
            for(let i = 0; i < lines.length; i++) {
                let line1 = lines[i];
                let line2 = lines[i+1];
                if(!line2) break;
                let name = "", email = "";
                if(!line1.includes('@') && line2.includes('@')) {
                    name = line1; email = line2.toLowerCase(); i++;
                } else if(line1.includes('@') && !line2.includes('@')) {
                    email = line1.toLowerCase(); name = line2; i++;
                }
                if(name && email) {
                    const newStudentRef = push(studentsRef);
                    const newStuObj = {
                        id: newStudentRef.key, name: name, email: email, className: 'غير موزع',
                        phone: '966566688614', actions: [],
                        attendanceStats: { absents: 0, lates: 0, excuses: 0 }
                    };
                    allStudents.push(newStuObj);
                    set(newStudentRef, newStuObj);
                    count++;
                }
            }
            document.getElementById('bulk-students-input').value = '';
            renderView();
            alert(`تم حفظ القائمة العامة بنجاح (${count} طالب) في سحابتك!`);
        };

        window.searchGlobalStudents = function() {
            const query = document.getElementById('global-search-input').value.trim().toLowerCase();
            const resultsBox = document.getElementById('global-search-results');
            if(!query) { resultsBox.innerHTML = ''; resultsBox.classList.add('hidden'); return; }
            const matches = allStudents.filter(s => s.name.toLowerCase().includes(query) || (s.email && s.email.toLowerCase().includes(query)));
            if(matches.length === 0) {
                resultsBox.innerHTML = `<div class="p-3 text-sm text-gray-500">لا توجد نتائج مطابقة.</div>`;
                resultsBox.classList.remove('hidden');
                return;
            }
            resultsBox.innerHTML = '';
            matches.forEach(student => {
                resultsBox.innerHTML += `
                    <div class="p-3 hover:bg-indigo-50 flex justify-between items-center border-b text-sm">
                        <div>
                            <span class="font-bold text-gray-800">${student.name}</span>
                            <span class="text-xs text-indigo-600 block">${student.email || ''} (الحالة: ${student.className})</span>
                        </div>
                        <button onclick="transferStudentToCurrentClass('${student.id}')" class="bg-green-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold">➕ إضافة</button>
                    </div>
                `;
            });
            resultsBox.classList.remove('hidden');
        };

        window.transferStudentToCurrentClass = async function(id) {
            const student = allStudents.find(s => s.id === id);
            if(student) {
                student.className = activeClass;
                renderClassStudents();
                document.getElementById('global-search-input').value = '';
                document.getElementById('global-search-results').classList.add('hidden');
                update(ref(db, `fifi_students_tracker/${id}`), { className: activeClass });
            }
        };

        window.editStudent = async function(id) {
            const student = allStudents.find(s => s.id === id);
            if(!student) return;
            const newName = prompt("تعديل اسم الطالب:", student.name);
            if(newName === null) return;
            const newEmail = prompt("تعديل إيميل مدرستي:", student.email || '');
            student.name = newName.trim();
            student.email = newEmail.trim();
            renderView();
            if(activeClass) renderClassStudents();
            update(ref(db, `fifi_students_tracker/${id}`), { name: student.name, email: student.email });
        };

        window.deleteStudent = async function(id) {
            if(confirm('هل أنت متأكد من حذف هذا الطالب نهائياً؟')) {
                allStudents = allStudents.filter(s => s.id !== id);
                renderView();
                if(activeClass) renderClassStudents();
                remove(ref(db, `fifi_students_tracker/${id}`));
            }
        };

        window.recordAction = function(actionName, scoreChange = 0, attendanceType = null) {
            if(!currentStudentId) return;
            closeActionModal();

            const student = allStudents.find(s => s.id === currentStudentId);
            if(student) {
                const now = new Date();
                const dayName = now.toLocaleDateString('ar-SA', { weekday: 'long' });
                const dateFormatted = now.toLocaleDateString('ar-SA', { year: 'numeric', month: '2-digit', day: '2-digit' });
                const timeFormatted = now.toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' });
                const formattedTime = `${dayName} | ${dateFormatted} - ${timeFormatted}`;

                if(attendanceType) {
                    if(attendanceType === 'غائب') student.attendanceStats.absents = (student.attendanceStats.absents || 0) + 1;
                    if(attendanceType === 'متأخر') student.attendanceStats.lates = (student.attendanceStats.lates || 0) + 1;
                    if(attendanceType === 'مستأذن') student.attendanceStats.excuses = (student.attendanceStats.excuses || 0) + 1;
                }
                
                const newRecord = { title: actionName, score: scoreChange
