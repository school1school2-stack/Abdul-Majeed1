    <!-- استيراد مكتبات Firebase (Realtime Database) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, push, remove, update, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDbppVi6vpLyX7Q-dqc6De745MBMGKUpQ",
            authDomain: "aziztest-a0f6c.firebaseapp.com",
            databaseURL: "https://aziztest-a0f6c-default-rtdb.firebaseio.com",
            projectId: "aziztest-a0f6c",
            storageBucket: "aziztest-a0f6c.firebasestorage.app",
            messagingSenderId: "843503616133",
            appId: "1:843503616133:web:e04b79015132e81f5369ec",
            measurementId: "G-LFMSMEQC8Z"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let activeClass = null;
        let currentStudentId = null;
        let allStudents = [];
        let customActions = [];
        let classList = ['الفصل الأول', 'الفصل الثاني', 'الفصل الثالث', 'الفصل الرابع'];
        let editingActionIndex = null;
        let editingClassIndex = null;

        const themes = [
            { name: "الذهب الأبيض", bg: "linear-gradient(135deg, #fdfbf7 0%, #eef2f3 100%)", headerBg: "bg-stone-800 text-amber-100 border-stone-700", btnPrimary: "bg-stone-800 hover:bg-stone-900 text-amber-100" },
            { name: "اللؤلؤ الطبيعي", bg: "linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%)", headerBg: "bg-slate-700 text-slate-100 border-slate-600", btnPrimary: "bg-slate-700 hover:bg-slate-800 text-white" },
            { name: "الكشمير الفاخر", bg: "linear-gradient(135deg, #fcfaf8 0%, #f5efe6 100%)", headerBg: "bg-amber-900 text-amber-50 border-amber-800", btnPrimary: "bg-amber-900 hover:bg-amber-950 text-amber-50" },
            { name: "الفانيلا اللاتيه", bg: "linear-gradient(135deg, #faf7f2 0%, #f0eae1 100%)", headerBg: "bg-amber-950 text-orange-100 border-amber-900", btnPrimary: "bg-amber-950 hover:bg-black text-orange-100" },
            { name: "السحاب الفرنسي", bg: "linear-gradient(135deg, #f4f6f9 0%, #e2e8f0 100%)", headerBg: "bg-sky-900 text-sky-50 border-sky-800", btnPrimary: "bg-sky-900 hover:bg-sky-950 text-white" },
            { name: "الزمرد الخفيف", bg: "linear-gradient(135deg, #f4fcf7 0%, #e6f4ed 100%)", headerBg: "bg-emerald-900 text-emerald-50 border-emerald-800", btnPrimary: "bg-emerald-800 hover:bg-emerald-900 text-white" },
            { name: "الشمبانيا الملكي", bg: "linear-gradient(135deg, #fffcf4 0%, #f7f1e3 100%)", headerBg: "bg-yellow-900 text-yellow-50 border-yellow-800", btnPrimary: "bg-yellow-800 hover:bg-yellow-900 text-white" },
            { name: "الكوارتز الوردي", bg: "linear-gradient(135deg, #fdf8f8 0%, #f9f0f0 100%)", headerBg: "bg-rose-900 text-rose-50 border-rose-800", btnPrimary: "bg-rose-800 hover:bg-rose-900 text-white" },
            { name: "النحاس الدافئ", bg: "linear-gradient(135deg, #faf6f5 0%, #f0eae6 100%)", headerBg: "bg-orange-950 text-orange-50 border-orange-900", btnPrimary: "bg-orange-900 hover:bg-orange-950 text-white" },
            { name: "اللافندر الملكي الفاتح", bg: "linear-gradient(135deg, #f7f5fa 0%, #edeaf2 100%)", headerBg: "bg-purple-950 text-purple-50 border-purple-900", btnPrimary: "bg-purple-900 hover:bg-purple-950 text-white" }
        ];

        function applyRandomTheme() {
            const randomIndex = Math.floor(Math.random() * themes.length);
            const selectedTheme = themes[randomIndex];
            document.body.style.background = selectedTheme.bg;
            const header = document.getElementById('main-header');
            if(header) {
                header.className = `p-4 shadow-md border-b transition-all duration-500 ${selectedTheme.headerBg}`;
            }
            window.currentTheme = selectedTheme;
        }

        const defaultActions = [
            { icon: '✅', name: 'إجابة صحيحة', score: 1.0, color: '#28a745' },
            { icon: '❌', name: 'إجابة خاطئة', score: -1.0, color: '#dc3545' },
            { icon: '💡', name: 'مشاركة', score: 1.0, color: '#17a2b8' },
            { icon: '📘', name: 'حل الواجب', score: 3.0, color: '#20c997' },
            { icon: '📕', name: 'لم يحل الواجب', score: -3.0, color: '#e83e8c' },
            { icon: '💤', name: 'النوم في الحصة', score: -1.0, color: '#6610f2' },
            { icon: '🗣️', name: 'التحدث أثناء الدرس', score: -1.0, color: '#6f42c1' },
            { icon: '🏃‍♂️', name: 'خرج ولم يعد', score: -1.0, color: '#007bff' },
            { icon: '😑', name: 'غير مهتم', score: -1.0, color: '#fd7e14' },
            { icon: '📁', name: 'نسيان ملف أو واجب', score: -5.0, color: '#ffc107' },
            { icon: '📱', name: 'استخدام الهاتف', score: -1.0, color: '#d9534f' },
            { icon: '⭐', name: 'إنجاز ملف', score: 5.0, color: '#00cec9' },
            { icon: '🎁', name: 'هدية', score: 5.0, color: '#e17055' }
        ];

        // سرعة خارقة: تحميل فوري من الذاكرة المحلية (LocalStorage) ثم تحديث صامت للخلفية
        window.initFastLoad = function() {
            applyRandomTheme();

            const cachedStudents = localStorage.getItem('fifi_cached_students');
            const cachedActions = localStorage.getItem('fifi_cached_actions');
            const cachedClasses = localStorage.getItem('fifi_cached_classes');

            if (cachedStudents) allStudents = JSON.parse(cachedStudents);
            if (cachedActions) customActions = JSON.parse(cachedActions); else customActions = defaultActions;
            if (cachedClasses) classList = JSON.parse(cachedClasses);

            renderView();
            renderCustomActionsUI();
            renderSettingsActionsDropdown();
            renderClassesListUI();

            // جلب البيانات من السحابة في الخلفية دون أي تعليق لواجهة المستخدم
            setTimeout(async () => {
                const dbRef = ref(db);
                try {
                    const [studentsSnap, settingsSnap, classesSnap] = await Promise.all([
                        get(child(dbRef, 'fifi_students_tracker')),
                        get(child(dbRef, 'fifi_custom_actions')),
                        get(child(dbRef, 'fifi_classes_list'))
                    ]);

                    let updated = false;
                    if (studentsSnap.exists()) {
                        const newStudents = [];
                        const data = studentsSnap.val();
                        Object.keys(data).forEach((key) => {
                            const studentItem = data[key];
                            newStudents.push({ 
                                id: key, 
                                name: studentItem.name || 'بدون اسم',
                                email: studentItem.email || 'بدون إيميل',
                                className: studentItem.className || 'غير موزع',
                                phone: studentItem.phone || '966566688614',
                                actions: studentItem.actions || [],
                                attendanceStats: studentItem.attendanceStats || { absents: 0, lates: 0, excuses: 0 }
                            });
                        });
                        if(JSON.stringify(newStudents) !== JSON.stringify(allStudents)) {
                            allStudents = newStudents;
                            localStorage.setItem('fifi_cached_students', JSON.stringify(allStudents));
                            updated = true;
                        }
                    }

                    if (settingsSnap.exists()) {
                        const rawData = settingsSnap.val();
                        const newActions = Array.isArray(rawData) ? rawData : Object.values(rawData);
                        if(JSON.stringify(newActions) !== JSON.stringify(customActions)) {
                            customActions = newActions;
                            localStorage.setItem('fifi_cached_actions', JSON.stringify(customActions));
                            updated = true;
                        }
                    }

                    if (classesSnap.exists()) {
                        const newClasses = classesSnap.val();
                        if(JSON.stringify(newClasses) !== JSON.stringify(classList)) {
                            classList = newClasses;
                            localStorage.setItem('fifi_cached_classes', JSON.stringify(classList));
                            updated = true;
                        }
                    }

                    if(updated) {
                        renderView();
                        renderCustomActionsUI();
                        renderSettingsActionsDropdown();
                        renderClassesListUI();
                        if(activeClass) renderClassStudents();
                    }
                } catch (error) {
                    console.error("خطأ في المزامنة الخلفية: ", error);
                }
            }, 100);
        };

        window.openClass = function(className) {
            activeClass = className;
            document.getElementById('main-dashboard').classList.add('hidden');
            document.getElementById('class-view').classList.remove('hidden');
            document.getElementById('class-title-header').innerText = `إدارة فصل: ${className}`;
            renderClassStudents();
        };

        window.backToHome = function() {
            activeClass = null;
            document.getElementById('class-view').classList.add('hidden');
            document.getElementById('main-dashboard').classList.remove('hidden');
            renderView();
        };

        window.openSettingsModal = function(tabName = 'classes') {
            document.getElementById('settings-modal').classList.remove('hidden');
            document.getElementById('settings-modal').classList.add('flex');
            switchSettingsTab(tabName);
        };

        window.closeSettingsModal = function() {
            document.getElementById('settings-modal').classList.add('hidden');
            document.getElementById('settings-modal').classList.remove('flex');
            resetActionForm();
            resetClassForm();
        };

        window.switchSettingsTab = function(tab) {
            const classesTabContent = document.getElementById('classes-tab-content');
            const actionsTabContent = document.getElementById('actions-tab-content');
            const btnClasses = document.getElementById('btn-tab-classes');
            const btnActions = document.getElementById('btn-tab-actions');
            const activeColorClass = window.currentTheme ? window.currentTheme.btnPrimary.split(' ')[0] : 'bg-slate-700';

            if(tab === 'classes') {
                classesTabContent.classList.remove('hidden');
                actionsTabContent.classList.add('hidden');
                btnClasses.className = `flex-1 py-2.5 rounded-xl font-bold text-xs ${activeColorClass} text-white shadow transition-all cursor-pointer`;
                btnActions.className = "flex-1 py-2.5 rounded-xl font-bold text-xs bg-slate-100 text-slate-600 transition-all cursor-pointer";
            } else {
                classesTabContent.classList.add('hidden');
                actionsTabContent.classList.remove('hidden');
                btnActions.className = `flex-1 py-2.5 rounded-xl font-bold text-xs ${activeColorClass} text-white shadow transition-all cursor-pointer`;
                btnClasses.className = "flex-1 py-2.5 rounded-xl font-bold text-xs bg-slate-100 text-slate-600 transition-all cursor-pointer";
                renderSettingsActionsDropdown();
            }
        };

        window.saveClassItem = function() {
            const classNameInput = document.getElementById('new-class-name');
            const name = classNameInput.value.trim();
            if(!name) return alert('الرجاء إدخال اسم الفصل');

            if(editingClassIndex !== null) {
                const oldName = classList[editingClassIndex];
                classList[editingClassIndex] = name;
                allStudents.forEach(stu => {
                    if(stu.className === oldName) stu.className = name;
                });
                editingClassIndex = null;
                document.getElementById('save-class-btn').innerText = "إضافة ➕";
            } else {
                if(classList.includes(name)) return alert('هذا الفصل موجود مسبقاً');
                classList.push(name);
            }

            classNameInput.value = '';
            localStorage.setItem('fifi_cached_classes', JSON.stringify(classList));
            renderClassesListUI();
            renderView();
            set(ref(db, 'fifi_classes_list'), classList);
        };

        window.editClassItem = function(index) {
            document.getElementById('new-class-name').value = classList[index];
            editingClassIndex = index;
            document.getElementById('save-class-btn').innerText = "تعديل ✏️";
        };

        window.deleteClassItem = function(index) {
            if(confirm('هل أنت متأكد من حذف هذا الفصل؟')) {
                const removedName = classList[index];
                classList.splice(index, 1);
                allStudents.forEach(stu => {
                    if(stu.className === removedName) stu.className = 'غير موزع';
                });
                localStorage.setItem('fifi_cached_classes', JSON.stringify(classList));
                renderClassesListUI();
                renderView();
                set(ref(db, 'fifi_classes_list'), classList);
            }
        };

        window.resetClassForm = function() {
            editingClassIndex = null;
            document.getElementById('new-class-name').value = '';
            document.getElementById('save-class-btn').innerText = "إضافة ➕";
        };

        function renderClassesListUI() {
            const container = document.getElementById('settings-classes-list');
            if(!container) return;
            container.innerHTML = '';
            classList.forEach((cls, index) => {
                container.innerHTML += `
                    <div class="bg-white p-2.5 rounded-xl border border-slate-200 flex justify-between items-center text-xs shadow-xs">
                        <span class="font-bold text-slate-700">${cls}</span>
                        <div class="flex gap-1.5">
                            <button onclick="editClassItem(${index})" class="bg-amber-50 text-amber-700 px-2 py-1 rounded-lg font-semibold cursor-pointer">✏️ تعديل</button>
                            <button onclick="deleteClassItem(${index})" class="bg-rose-50 text-rose-600 px-2 py-1 rounded-lg font-semibold cursor-pointer">🗑️ حذف</button>
                        </div>
                    </div>
                `;
            });
        }

        window.renderSettingsActionsDropdown = function() {
            const selectEl = document.getElementById('actions-dropdown-select');
            if(!selectEl) return;
            selectEl.innerHTML = `<option value="">-- اختر تقييماً للتعديل أو أضف جديداً --</option>`;
            if (customActions && customActions.length > 0) {
                customActions.forEach((act, index) => {
                    const scoreText = act.score > 0 ? '+' + act.score : act.score;
                    selectEl.innerHTML += `<option value="${index}">${act.icon || '⭐'} ${act.name} (${scoreText})</option>`;
                });
            }
        };

        window.onSelectActionToEdit = function() {
            const index = document.getElementById('actions-dropdown-select').value;
            if(index === "") {
                resetActionForm();
                return;
            }
            const act = customActions[index];
            if(!act) return;
            
            document.getElementById('new-action-icon').value = act.icon || '⭐';
            document.getElementById('new-action-name').value = act.name;
            document.getElementById('new-action-score').value = act.score;
            document.getElementById('new-action-color').value = act.color;
            editingActionIndex = parseInt(index);
            document.getElementById('save-action-btn').innerText = "تعديل التقييم ✏️";
            document.getElementById('delete-action-btn').classList.remove('hidden');
        };

        window.saveCustomActionFromDropdown = function() {
            const icon = document.getElementById('new-action-icon').value;
            const name = document.getElementById('new-action-name').value.trim();
            const score = parseFloat(document.getElementById('new-action-score').value);
            const color = document.getElementById('new-action-color').value;

            if(!name || isNaN(score)) return alert('الرجاء إدخال اسم التقييم والدرجة بشكل صحيح.');

            const newActObj = { icon, name, score, color };

            if(editingActionIndex !== null && editingActionIndex >= 0) {
                customActions[editingActionIndex] = newActObj;
            } else {
                customActions.push(newActObj);
            }

            localStorage.setItem('fifi_cached_actions', JSON.stringify(customActions));
            set(ref(db, 'fifi_custom_actions'), customActions);
            renderCustomActionsUI();
            renderSettingsActionsDropdown();
            resetActionForm();
        };

        window.deleteSelectedAction = function() {
            if(editingActionIndex === null || editingActionIndex < 0) return alert('الرجاء اختيار تقييم من القائمة أولاً للحذف');
            if(confirm('هل أنت متأكد من حذف هذا التقييم؟')) {
                customActions.splice(editingActionIndex, 1);
                localStorage.setItem('fifi_cached_actions', JSON.stringify(customActions));
                set(ref(db, 'fifi_custom_actions'), customActions);
                renderCustomActionsUI();
                renderSettingsActionsDropdown();
                resetActionForm();
            }
        };

        window.resetActionForm = function() {
            editingActionIndex = null;
            const selectEl = document.getElementById('actions-dropdown-select');
            if(selectEl) selectEl.value = "";
            document.getElementById('new-action-name').value = '';
            document.getElementById('new-action-score').value = '';
            document.getElementById('new-action-icon').value = '⭐';
            document.getElementById('save-action-btn').innerText = "حفظ كتقييم جديد 🚀";
            document.getElementById('delete-action-btn').classList.add('hidden');
        };

        window.renderCustomActionsUI = function() {
            const container = document.getElementById('custom-actions-container');
            if(!container) return;
            container.innerHTML = '';
            
            customActions.forEach(act => {
                const fullName = `${act.icon || ''} ${act.name}`.trim();
                const actColor = act.color || '#64748b';
                
                container.innerHTML += `
                    <div class="bg-white p-2.5 rounded-xl border border-slate-100 flex items-center justify-between shadow-xs hover:shadow transition">
                        <button onclick="recordAction('${fullName}', ${act.score}, null)" class="flex items-center gap-2.5 flex-grow text-right cursor-pointer">
                            <span class="w-9 h-9 rounded-lg flex items-center justify-center text-base border" style="background-color: ${actColor}15; border-color: ${actColor}40;">
                                ${act.icon || '⭐'}
                            </span>
                            <span class="font-bold text-xs text-slate-700">${act.name}</span>
                        </button>
                        <span class="text-[11px] font-bold px-2 py-0.5 rounded-md bg-slate-100 text-slate-600">${act.score > 0 ? '+' + act.score : act.score}</span>
                    </div>
                `;
            });
        }

        window.superSmartBulkAdd = function() {
            const bulkText = document.getElementById('bulk-students-input').value.trim();
            if(!bulkText) return alert('الرجاء إدخال قائمة الطلاب في المربع');
            const lines = bulkText.split('\n').map(l => l.trim()).filter(l => l !== "");
            let count = 0;
            const studentsRef = ref(db, 'fifi_students_tracker');
            const updates = {};

            for(let i = 0; i < lines.length; i++) {
                let line1 = lines[i];
                let line2 = lines[i+1];
                if(!line2) break;
                let name = "", email = "";
                if(!line1.includes('@') && line2.includes('@')) {
                    name = line1; email = line2.toLowerCase(); i++;
                } else if(line1.includes('@') && !line2.includes('@')) {
                    email = line1.toLowerCase(); name = line2; i++;
                }
                if(name && email) {
                    const newStudentRef = push(studentsRef);
                    const newStuObj = {
                        id: newStudentRef.key, name: name, email: email, className: 'غير موزع',
                        phone: '966566688614', actions: [],
                        attendanceStats: { absents: 0, lates: 0, excuses: 0 }
                    };
                    allStudents.push(newStuObj);
                    updates[newStudentRef.key] = newStuObj;
                    count++;
                }
            }

            if(count > 0) {
                document.getElementById('bulk-students-input').value = '';
                localStorage.setItem('fifi_cached_students', JSON.stringify(allStudents));
                renderView();
                update(studentsRef, updates);
                alert(`تم حفظ ${count} طالب في السحابة بنجاح وبسرعة فائقة ✅`);
            } else {
                alert('تأكد من تنسيق القائمة (اسم الطالب ثم الإيميل في كل سطر).');
            }
        };

        window.copyAllStudents = function() {
            if(allStudents.length === 0) return alert('لا توجد أسماء للنسخ');
            let textToCopy = "";
            allStudents.forEach(s => {
                textToCopy += `${s.name}\n${s.email || ''}\n`;
            });
            navigator.clipboard.writeText(textToCopy).then(() => {
                alert('تم نسخ جميع الأسماء والإيميلات بنجاح 📋');
            });
        };

        window.deleteAllStudents = function() {
            if(confirm('تحذير: هل أنت متأكد من حذف جميع الطلاب من السحابة نهائياً؟')) {
                allStudents = [];
                localStorage.setItem('fifi_cached_students', JSON.stringify([]));
                renderView();
                if(activeClass) renderClassStudents();
                set(ref(db, 'fifi_students_tracker'), null);
            }
        };

        window.searchGlobalStudents = function() {
            const query = document.getElementById('global-search-input').value.trim().toLowerCase();
            const resultsBox = document.getElementById('global-search-results');
            if(!query) { resultsBox.innerHTML = ''; resultsBox.classList.add('hidden'); return; }
            const matches = allStudents.filter(s => s.name.toLowerCase().includes(query) || (s.email && s.email.toLowerCase().includes(query)));
            if(matches.length === 0) {
                resultsBox.innerHTML = `<div class="p-2.5 text-xs text-slate-500">لا توجد نتائج مطابقة.</div>`;
                resultsBox.classList.remove('hidden');
                return;
            }
            resultsBox.innerHTML = '';
            matches.forEach(student => {
                resultsBox.innerHTML += `
                    <div class="p-2.5 hover:bg-slate-50 flex justify-between items-center border-b border-slate-100 text-xs">
                        <div>
                            <span class="font-bold text-slate-700">${student.name}</span>
                            <span class="text-[11px] text-slate-500 block">${student.email || ''} (الحالة: ${student.className})</span>
                        </div>
                        <button onclick="transferStudentToCurrentClass('${student.id}')" class="bg-emerald-600 text-white px-2.5 py-1 rounded-md font-bold text-[11px] cursor-pointer">➕ إضافة</button>
                    </div>
                `;
            });
            resultsBox.classList.remove('hidden');
        };

        window.transferStudentToCurrentClass = function(id) {
            const student = allStudents.find(s => s.id === id);
            if(student) {
                student.className = activeClass;
                localStorage.setItem('fifi_cached_students', JSON.stringify(allStudents));
                renderClassStudents();
                document.getElementById('global-search-input').value = '';
                document.getElementById('global-search-results').classList.add('hidden');
                update(ref(db, `fifi_students_tracker/${id}`), { className: activeClass });
            }
        };

        window.editStudent = function(id) {
            const student = allStudents.find(s => s.id === id);
            if(!student) return;
            const newName = prompt("تعديل اسم الطالب:", student.name);
            if(newName === null) return;
            const newEmail = prompt("تعديل إيميل مدرستي:", student.email || '');
            student.name = newName.trim();
            student.email = newEmail.trim();
            localStorage.setItem('fifi_cached_students', JSON.stringify(allStudents));
            renderView();
            if(activeClass) renderClassStudents();
            update(ref(db, `fifi_students_tracker/${id}`), { name: student.name, email: student.email });
        };

        window.deleteStudent = function(id) {
            if(confirm('هل أنت متأكد من حذف هذا الطالب نهائياً؟')) {
                allStudents = allStudents.filter(s => s.id !== id);
                localStorage.setItem('fifi_cached_students', JSON.stringify(allStudents));
                renderView();
                if(activeClass) renderClassStudents();
                remove(ref(db, `fifi_students_tracker/${id}`));
